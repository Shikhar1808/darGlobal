# AWS overlay: Caddy serves HTTPS on 80/443; the app port is no longer public.
# Used by deploy/up.sh: docker compose -f docker-compose.yml -f deploy/compose.aws.yml up -d --build
services:
  app:
    ports: !reset []
    restart: unless-stopped
  redis:
    restart: unless-stopped
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?run deploy/up.sh, or set DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates survive restarts (Let's Encrypt has rate limits)
    depends_on: [app]

volumes:
  caddy-data:
